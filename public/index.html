<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>团队文件储存平台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 登录界面 -->
  <div id="login-view" class="login-view">
    <button class="theme-toggle fab" type="button" aria-label="切换主题">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <form id="login-form" class="card login-card" autocomplete="off">
      <div class="login-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2.2h6.8A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11z"/>
        </svg>
      </div>
      <h1>团队文件储存平台</h1>
      <p class="muted center">使用管理员分发的账号登录</p>

      <div class="login-track" id="login-track" data-step="1">
        <!-- 第一步：用户名 -->
        <div class="login-slide">
          <label>用户名
            <input id="login-username" type="text" name="username" required autocomplete="username" placeholder="请输入用户名" />
          </label>
          <p id="login-error1" class="error" hidden></p>
          <button type="button" class="btn-primary btn-block" id="login-next">下一步</button>
        </div>

        <!-- 第二步：密码 -->
        <div class="login-slide">
          <div class="login-as muted" id="login-as"></div>
          <label>密码
            <input id="login-password" type="password" name="password" required autocomplete="current-password" placeholder="请输入密码" />
          </label>
          <p id="login-error" class="error" hidden></p>
          <div class="login-actions">
            <button type="button" class="btn-ghost" id="login-back">上一步</button>
            <button type="submit" class="btn-primary" id="login-btn">登录</button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- 主应用 -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2.2h6.8A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11z"/>
        </svg>
        <span>文件储存平台</span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="files">文件</button>
        <button class="tab" data-tab="messages">留言墙</button>
        <button class="tab" data-tab="admin" id="admin-tab" hidden>成员管理</button>
      </nav>
      <div class="topbar-right">
        <span id="quota-badge" class="badge" hidden></span>
        <span id="user-name" class="muted"></span>
        <button class="theme-toggle" type="button" aria-label="切换主题">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn-ghost" id="logout-btn">退出</button>
      </div>
    </header>

    <main>
      <!-- 文件区 -->
      <section id="panel-files" class="panel active">
        <div class="panel-head">
          <h2>文件库</h2>
          <span id="quota-text" class="muted"></span>
        </div>

        <div class="card upload-card">
          <h3>上传文件</h3>
          <div class="upload-row">
            <input id="file-input" type="file" />
            <input id="file-note" type="text" class="grow" placeholder="备注（可选）" maxlength="1000" />
            <button id="upload-btn" class="btn-primary">上传</button>
          </div>
          <div class="progress-wrap" hidden id="progress-wrap">
            <div class="progress"><div id="progress-bar"></div></div>
            <span id="progress-text" class="muted"></span>
          </div>
          <p id="upload-error" class="error" hidden></p>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>文件名</th>
                  <th>上传者</th>
                  <th>大小</th>
                  <th>备注</th>
                  <th>上传时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="files-body"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 留言墙 -->
      <section id="panel-messages" class="panel">
        <div class="panel-head">
          <h2>留言墙</h2>
        </div>
        <div class="card">
          <form id="message-form" class="message-form">
            <input id="message-input" type="text" placeholder="写点什么…" maxlength="1000" required />
            <button type="submit" class="btn-primary">发布</button>
          </form>
        </div>
        <div id="messages-list" class="messages-list"></div>
      </section>

      <!-- 成员管理（仅管理员） -->
      <section id="panel-admin" class="panel">
        <div class="panel-head">
          <h2>成员管理</h2>
        </div>
        <div class="card">
          <h3>添加成员</h3>
          <form id="add-user-form" class="user-form">
            <input id="new-username" type="text" placeholder="用户名" required />
            <input id="new-password" type="text" placeholder="初始密码" required />
            <select id="new-role">
              <option value="member">成员（每日 10 个文件）</option>
              <option value="admin">管理员（不限上传）</option>
            </select>
            <button type="submit" class="btn-primary">添加</button>
          </form>
          <p id="user-error" class="error" hidden></p>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr>
              </thead>
              <tbody id="users-body"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 编辑备注弹窗 -->
  <dialog id="edit-dialog">
    <form method="dialog" class="card">
      <h3>编辑备注 / 文件名</h3>
      <label>文件名
        <input id="edit-name" type="text" maxlength="255" />
      </label>
      <label>备注
        <textarea id="edit-note" rows="3" maxlength="1000"></textarea>
      </label>
      <input id="edit-id" type="hidden" />
      <div class="dialog-actions">
        <button value="cancel" class="btn-ghost">取消</button>
        <button value="ok" id="edit-save" class="btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
